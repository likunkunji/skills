<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
/* =========================================================================
   BASE SKELETON — layout only. Themes must not override the flex/container
   rules below, otherwise row auto-fit breaks and content gets clipped.
   Colors, borders, shadows, fonts and decorations live in assets/themes/*.css
   ========================================================================= */
:root{
  --w:{{WIDTH}}px;
  --h:{{HEIGHT}}px;
  --row-h:{{ROW_H}}px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--w);height:var(--h);overflow:hidden}
body{
  padding:{{PAD_Y}}px {{PAD_X}}px;
  display:flex;flex-direction:column;
  position:relative;
  -webkit-font-smoothing:antialiased;
}

/* decoration layer sits under the content and never takes part in layout */
.decor{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.head,.cols,.foot{position:relative;z-index:1}

/* ---------- header ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  padding-bottom:14px;margin-bottom:16px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto}
.mark svg{width:21px;height:21px}
.head-mid{flex:0 0 auto;display:flex;align-items:center}
.title{font-size:{{TITLE_FS}}px;font-weight:800;line-height:1.1}
.title .thin{font-weight:400}
.sub{font-size:{{SUB_FS}}px;margin-top:5px}
.head-r{text-align:right;flex:0 0 auto;padding-bottom:2px;min-width:0}
.date{font-size:{{DATE_FS}}px;font-weight:700}
.meta{font-size:{{META_FS}}px;margin-top:5px}

/* ---------- columns ---------- */
.cols{flex:1 1 auto;display:grid;gap:18px;grid-template-columns:repeat({{COL_COUNT}},minmax(0,1fr));min-height:0}
.cols.vertical{grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(0,1fr)}
.col{padding:12px 14px 10px;min-height:0;display:flex;flex-direction:column;
  position:relative;overflow:hidden}
.col-head{display:flex;align-items:center;gap:9px;flex:0 0 auto;padding:2px 2px 10px;margin-bottom:6px}
.chip{font-size:{{COLT_FS}}px;font-weight:800;padding:3px 10px;white-space:nowrap}
.col-note{font-size:{{COLN_FS}}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{list-style:none;flex:1 1 auto;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-start}

/* ---------- row ---------- */
.row{flex:1 1 0;min-height:0;max-height:var(--row-h);overflow:hidden;
  container-type:size;container-name:row;
  display:flex;align-items:center;gap:10px;padding:0 4px}
/* Rows decide for themselves whether a description line still fits. */
@container row (max-height:{{COMPACT_BELOW}}px){
  .l2{display:none}
}
.rank{flex:0 0 auto;width:22px;text-align:center;font-size:{{RANK_FS}}px;font-weight:800;
  font-variant-numeric:tabular-nums}
.main{flex:1 1 auto;min-width:0;overflow:hidden}
.l1{display:flex;align-items:center;gap:8px;min-width:0}
.name{flex:1 1 auto;min-width:0;font-size:{{NAME_FS}}px;font-weight:700;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex:0 0 auto;display:flex;align-items:center;gap:5px;font-size:{{TAG_FS}}px;
  max-width:34%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.st{flex:0 0 auto;font-size:{{ST_FS}}px;font-variant-numeric:tabular-nums;white-space:nowrap}
.st::before{content:"★";margin-right:3px;font-size:.92em}
.dl{flex:0 0 auto;font-size:{{DL_FS}}px;font-weight:800;padding:1px 7px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.l2{font-size:{{DESC_FS}}px;line-height:1.3;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.compact .l2{display:none}
body.compact .l1{height:100%;align-items:center}

/* ---------- footer ---------- */
.foot{flex:0 0 auto;display:flex;justify-content:space-between;gap:16px;align-items:center;
  padding-top:12px;margin-top:14px;font-size:{{FOOT_FS}}px}
.foot .r{white-space:nowrap}
</style>
<style>
/* ===================== THEME: {{THEME_NAME}} ===================== */
{{THEME_CSS}}
</style>
</head>
<body class="{{BODY_CLASS}}">

{{DECOR_BG}}

<header class="head">
  <div class="head-l">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>
      </span>
      <div>
        <div class="title">{{TITLE}}</div>
        <div class="sub">{{SUBTITLE}}</div>
      </div>
    </div>
  </div>
  {{DECOR_HEAD}}
  <div class="head-r">
    <div class="date">{{DATE_LINE}}</div>
    <div class="meta">{{META_LINE}}</div>
  </div>
</header>

<main class="cols {{COLS_CLASS}}">
{{COLUMNS}}
</main>

<footer class="foot">
  <span class="l">{{FOOTER_LEFT}}</span>
  <span class="r">{{FOOTER_RIGHT}}</span>
</footer>

</body>
</html>
